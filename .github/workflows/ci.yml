name: Firmware and game checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Game, menu and palette checks with ASan and UBSan
        run: ./tools/test_host.sh
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [default, doom]
    container: espressif/idf:v5.5.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build for ESP32-S3
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          if [[ "${{ matrix.mode }}" == "doom" ]]; then
            idf.py -D SDKCONFIG=sdkconfig.doom -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.doom' build size
            grep -q '^CONFIG_HUBGAMES_FULL_DOOM=y$' sdkconfig.doom
          else
            idf.py build size
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hubgames-esp32s3-${{ matrix.mode }}
          path: |
            build/hubgames.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
            build/flash_args
