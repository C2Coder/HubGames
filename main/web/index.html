<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HubGames</title>
<style>
* { box-sizing: border-box; margin: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #111; color: #eee; font-family: sans-serif; overflow: hidden; touch-action: none; }
#bar { position: absolute; top: 0; left: 0; right: 0; height: 16vh; display: flex; align-items: center; justify-content: center; gap: 6vw; z-index: 1; }
#who { font-size: 6vh; font-weight: bold; color: #888; min-width: 13vw; text-align: center; }
.t { height: 9vh; padding: 0 3vh; border-radius: 5vh; background: #333; display: flex; align-items: center; justify-content: center; font-size: 4.5vh; color: #aaa; }
#pad { height: 100vh; display: flex; }
#left, #right { flex: 1; display: flex; align-items: center; justify-content: center; padding-top: 10vh; }
#left { justify-content: flex-start; padding-left: 5vh; }
#joy { width: 52vh; height: 52vh; border-radius: 50%; background: #222; border: 0.5vh solid #444; position: relative; }
#knob { width: 22vh; height: 22vh; border-radius: 50%; background: #666; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
#dpad { display: grid; grid-template-columns: repeat(3, 19vh); grid-template-rows: repeat(3, 19vh); gap: 1.5vh; }
.k { background: #333; border-radius: 2.5vh; display: flex; align-items: center; justify-content: center; font-size: 8vh; color: #aaa; }
.caption { position: absolute; bottom: 3vh; left: 0; right: 0; text-align: center; font-size: 2.8vh; }
#hint { font-size: 2.7vh; max-width: 28vw; text-align: center; }
.on { filter: brightness(1.8); }
.hide { display: none !important; }
#ab { position: relative; width: 50vh; height: 50vh; }
.r { position: absolute; width: 23vh; height: 23vh; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9vh; font-weight: bold; color: #fff; }
#a { right: 0; top: 2vh; background: #b22; }
#b { left: 0; bottom: 2vh; background: #c80; }
#doompad { display: grid; grid-template-columns: 25vh 25vh; gap: 1.5vh; justify-items: center; align-items: center; transform: translateY(-7vh); }
#fire { grid-column: 1 / 3; width: 24vh; height: 24vh; border-radius: 50%; background: #b22; color: #fff; font-size: 6vh; font-weight: bold; }
#use { grid-column: 1 / 3; width: 30vh; height: 11vh; background: #c80; color: #fff; font-size: 5vh; }
.turn { width: 25vh; height: 25vh; }
#rot { display: none; height: 100%; align-items: center; justify-content: center; font-size: 6vw; color: #888; }
@media (orientation: portrait) { #rot { display: flex; } #bar, #pad { display: none; } }
</style>
</head>
<body>
<div id="rot">Rotate your phone</div>
<div id="bar"><div id="swap" class="t">ARROWS</div><div id="who">connecting...</div><div id="hint"></div><div class="t" data-b="start">II</div></div>
<div id="pad">
  <div id="left">
    <div id="joy"><div id="knob"></div></div>
    <div id="dpad" class="hide">
      <div></div><div class="k" data-b="up">&#9650;</div><div></div>
      <div class="k" data-b="left">&#9664;</div><div></div><div class="k" data-b="right">&#9654;</div>
      <div></div><div class="k" data-b="down">&#9660;</div><div></div>
    </div>
  </div>
  <div id="right">
    <div id="ab"><div id="a" class="r" data-b="a">A<span class="caption" id="acap"></span></div><div id="b" class="r" data-b="b">B<span class="caption" id="bcap"></span></div></div>
    <div id="doompad" class="hide">
      <div id="fire" class="k" data-b="a">FIRE</div>
      <div class="k turn" data-b="left">&#9664;</div><div class="k turn" data-b="right">&#9654;</div>
      <div id="use" class="k" data-b="b">USE</div>
    </div>
  </div>
</div>
<script>
const BITS = { up: 1, down: 2, left: 4, right: 8, a: 16, b: 32, start: 64 };
const who = document.getElementById('who');
let btn = 0, jx = 0, jy = 0, ws, pendingSend = null, lastSend = 0;

function send(urgent = true) {
  const delay = 20 - (performance.now() - lastSend);
  if (!urgent && delay > 0) {
    if (pendingSend === null) pendingSend = setTimeout(() => { pendingSend = null; send(); }, delay);
    return;
  }
  if (pendingSend !== null) { clearTimeout(pendingSend); pendingSend = null; }
  if (ws && ws.readyState === 1 && ws.bufferedAmount < 256) {
    ws.send(new Int8Array([btn | (currentProfile === 10 && !arrows ? 128 : 0), jx, jy]));
    lastSend = performance.now();
  }
}

let currentProfile = -1;
const profiles = [
  ['', '', ''], ['BOMB', '', 'MOVE'], ['BOOST', '', 'TURN'],
  ['ITEM', 'DRIFT', 'LEFT / RIGHT: STEER'], ['KICK', 'SPRINT', 'MOVE'],
  ['ROTATE', 'DROP', 'LEFT / RIGHT: MOVE'], ['FIRE', 'STRAFE', 'STICK: MOVE + TURN'],
  ['RESUME', 'QUIT', 'PAUSED'], ['AGAIN', 'MENU', 'ROUND OVER'], ['NEXT', 'MENU', 'PARTY CUP'],
  ['FIRE', 'USE', 'STICK: MOVE + STRAFE'], ['FIRE', '', 'MOVE']
];
function show(p, profile = 0, color) {
  if (profile !== currentProfile) {
    releaseControls();
    currentProfile = profile;
    syncLayout();
    const labels = profiles[profile] || profiles[0];
    document.getElementById('acap').textContent = labels[0];
    document.getElementById('bcap').textContent = labels[1];
    document.getElementById('hint').textContent = labels[2];
  }
  who.textContent = p < 0 ? 'connecting...' : p === 0 ? 'full' : 'P' + p;
  who.style.color = color !== undefined ? `rgb(${Math.round((color >> 11) * 255 / 31)},${Math.round(((color >> 5) & 63) * 255 / 63)},${Math.round((color & 31) * 255 / 31)})` : ['#888', '#0f0', '#08f', '#fc0', '#f0f', '#ff6000', '#0ff', '#fff', '#8040ff', '#b0ff00', '#ff3030', '#00b080', '#ff90c0'][p < 0 ? 0 : p] || '#888';
}

function connect() {
  ws = new WebSocket('ws://' + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = send;
  ws.onmessage = e => { const r = new Uint8Array(e.data); show(r[0], r[1] || 0, r.length >= 4 ? r[2] | (r[3] << 8) : undefined); };
  ws.onclose = () => { releaseControls(); show(-1); setTimeout(connect, 1000); };
}
connect();
setInterval(send, 100);

document.querySelectorAll('[data-b]').forEach(el => {
  const bit = BITS[el.dataset.b];
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    btn |= bit;
    el.classList.add('on');
    if (navigator.vibrate) navigator.vibrate(10);
    send();
  });
  const up = () => { btn &= ~bit; el.classList.remove('on'); send(); };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
});

const joy = document.getElementById('joy'), knob = document.getElementById('knob');
let jid = null;

function jmove(e) {
  const r = joy.getBoundingClientRect(), R = r.width / 2;
  let x = e.clientX - r.left - R, y = e.clientY - r.top - R;
  const d = Math.hypot(x, y);
  if (d > R) { x *= R / d; y *= R / d; }
  knob.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  const nx = Math.round(x / R * 100), ny = Math.round(y / R * 100);
  if (nx !== jx || ny !== jy) { jx = nx; jy = ny; send(false); }
}

function jend(e) {
  if (e.pointerId !== jid) return;
  jid = null;
  jx = jy = 0;
  knob.style.transform = 'translate(-50%, -50%)';
  send();
}

joy.addEventListener('pointerdown', e => { jid = e.pointerId; joy.setPointerCapture(jid); jmove(e); });
joy.addEventListener('pointermove', e => { if (e.pointerId === jid) jmove(e); });
joy.addEventListener('pointerup', jend);
joy.addEventListener('pointercancel', jend);

function releaseControls() {
  btn = jx = jy = 0;
  jid = null;
  knob.style.transform = 'translate(-50%, -50%)';
  document.querySelectorAll('.on').forEach(el => el.classList.remove('on'));
  send();
}
window.addEventListener('blur', releaseControls);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseControls(); });

// joystick or arrows, remembered per phone
const swap = document.getElementById('swap'), dpad = document.getElementById('dpad');
function setArrows(on) {
  releaseControls();
  syncLayout();
  try { localStorage.setItem('arrows', on ? '1' : ''); } catch (e) {}
}
function syncLayout() {
  const doom = currentProfile === 10;
  joy.classList.toggle('hide', arrows);
  dpad.classList.toggle('hide', !arrows);
  document.getElementById('ab').classList.toggle('hide', doom);
  document.getElementById('doompad').classList.toggle('hide', !doom);
  swap.textContent = arrows ? 'STICK' : 'ARROWS';
}
let arrows = false;
try { arrows = !!localStorage.getItem('arrows'); } catch (e) {}
setArrows(arrows);
swap.addEventListener('click', () => { arrows = !arrows; setArrows(arrows); });
</script>
</body>
</html>
